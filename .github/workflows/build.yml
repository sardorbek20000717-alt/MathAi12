      - name: Build APK
        run: |
          sed -i '/^android.ndk_path[[:space:]]*=/d' buildozer.spec

          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"

          echo "=== AIDL ==="
          which aidl
          aidl --version || true

          echo "=== Buildozer ==="
          buildozer --version

          echo "=== Building APK ==="
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Math-AI-12-APK
          path: bin/*.apk
          if-no-files-found: error
