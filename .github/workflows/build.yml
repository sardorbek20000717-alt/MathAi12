name: Build Math AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          SDKMANAGER_PATH="$(command -v sdkmanager)"

          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager topilmadi"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER_PATH"

          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "AIDL:"
          ls -l "$ANDROID_HOME/build-tools/35.0.0/aidl"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer Cython==0.29.36

      - name: Prepare Buildozer SDK
        run: |
          SDKMANAGER_PATH="$(command -v sdkmanager)"

          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager topilmadi"
            exit 1
          fi

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          rm -f "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          rm -f "$HOME/.buildozer/android/platform/android-sdk/tools/bin/avdmanager"

          ln -s "$SDKMANAGER_PATH" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

          AVDMANAGER_PATH="$(command -v avdmanager || true)"

          if [ -n "$AVDMANAGER_PATH" ]; then
            ln -s "$AVDMANAGER_PATH" \
              "$HOME/.buildozer/android/platform/android-sdk/tools/bin/avdmanager"
          fi

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/build-tools"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/platform-tools"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/platforms"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0"
          rm -rf "$HOME/.buildozer/android/platform/android-sdk/platform-tools"
          rm -rf "$HOME/.buildozer/android/platform/android-sdk/platforms/android-35"

          ln -s "$ANDROID_HOME/build-tools/35.0.0" \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0"

          ln -s "$ANDROID_HOME/platform-tools" \
            "$HOME/.buildozer/android/platform/android-sdk/platform-tools"

          ln -s "$ANDROID_HOME/platforms/android-35" \
            "$HOME/.buildozer/android/platform/android-sdk/platforms/android-35"

          echo "=== Buildozer SDK ==="
          ls -la "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          echo "=== sdkmanager test ==="
          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version

      - name: Build APK
        run: |
          set -e

          sed -i '/^android.ndk_path[[:space:]]*=/d' buildozer.spec

          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"

          echo "================================"
          echo "AIDL CHECK"
          echo "================================"

          which aidl
          aidl --version || true

          echo "================================"
          echo "SDKMANAGER CHECK"
          echo "================================"

          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version

          echo "================================"
          echo "BUILDOZER CHECK"
          echo "================================"

          buildozer --version

          echo "================================"
          echo "BUILDING APK"
          echo "================================"

          buildozer android debug

          echo "================================"
          echo "APK FILES"
          echo "================================"

          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Math-AI-12-APK
          path: bin/*.apk
          if-no-files-found: error
