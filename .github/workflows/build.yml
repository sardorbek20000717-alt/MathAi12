

name: Build Math AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          echo "=== Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo "=== AIDL ==="
          ls -la "$ANDROID_HOME/build-tools/35.0.0/aidl"

          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aidl" ]; then
            echo "ERROR: AIDL topilmadi yoki ishlamaydi"
            exit 1
          fi

          echo "AIDL tayyor."

          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer Cython==0.29.36

      - name: Prepare Buildozer SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "=== Buildozer SDK ==="
          ls -la "$HOME/.buildozer/android/platform/android-sdk"

          echo "=== Build tools through Buildozer ==="
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0"

      - name: Build APK
        run: |
          sed -i '/^android.ndk_path[[:space:]]*=/d' buildozer.spec

          export AND
